<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Account Management - Coffee Shop POS</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-layout" id="appLayout">
    <div class="main-content">
      <div class="toolbar">
        <h1 class="page-title">Account Management</h1>
        <button class="btn btn-primary" onclick="openAccountModal()">+ Create Account</button>
      </div>

      <div class="panel">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Username</th>
              <th>Role</th>
              <th>Created</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="accountsBody">
            <tr><td colspan="5">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Create Account Modal -->
  <div class="modal-overlay" id="accountModal" style="display:none;">
    <div class="modal-box">
      <h3>Create Account</h3>
      <form id="accountForm">
        <label>Username</label>
        <input type="text" id="newUsername" required />

        <label>Password</label>
        <input type="password" id="newPassword" required />

        <label>Confirm Password</label>
        <input type="password" id="confirmPassword" required />

        <label>Role</label>
        <select id="newRole" required>
          <option value="cashier">Cashier</option>
          <option value="admin">Admin</option>
        </select>

        <div class="error-msg" id="accountErrorMsg"></div>

        <div class="modal-actions">
          <button type="submit" class="btn btn-primary">Create</button>
          <button type="button" class="btn btn-secondary" onclick="closeAccountModal()">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/common.js"></script>
  <script src="js/accounts.js"></script>
</body>
</html>
