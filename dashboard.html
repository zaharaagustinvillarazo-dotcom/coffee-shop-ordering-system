<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dashboard - Coffee Shop POS</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="datetime-display">
    <span id="currentDate"></span>
    <span id="currentTime"></span>
  </div>
</header>
  <div class="app-layout" id="appLayout">
    <!-- Sidebar gets injected here by JS -->
    <div class="main-content">
      <h1 class="page-title">Dashboard</h1>

      <div class="cards-row">
        <div class="stat-card">
          <div class="label">Today's Sales</div>
          <div class="value" id="todaySales">₱0.00</div>
        </div>
        <div class="stat-card">
          <div class="label">Orders Today</div>
          <div class="value" id="todayOrders">0</div>
        </div>
        <div class="stat-card">
          <div class="label">Available Products</div>
          <div class="value" id="availableProducts">0</div>
        </div>
      </div>

      <div class="panel">
        <h2>Recent Orders</h2>
        <table>
          <thead>
            <tr>
              <th>Order #</th>
              <th>Cashier</th>
              <th>Total</th>
              <th>Date &amp; Time</th>
            </tr>
          </thead>
          <tbody id="recentOrdersBody">
            <tr><td colspan="4">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="js/common.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
